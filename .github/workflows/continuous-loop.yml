name: Continuous Loop

# 持续论文检查：每 30 分钟（以及手动触发）循环调用 opencode，
# 独立检查 paper/paper.tex 的 LaTeX 语法、引用、表格和数值是否与 out/ 数据一致，
# 发现问题就修复并重新编译 PDF；修改会提交回 main，再由 Sync to Gitee 推送。
#
# 与其他仓库的 Continuous Loop 不同，这里只保留“论文检查”这一种 opencode 调用，
# 不再运行 perf / bug / sci / apply 等其他阶段，也不运行 tests。
#
# ⭐ 失败保底：opencode 无法调用（免费池耗尽且官方 API 未配置）或任意步骤失败/被取消时——
#   1) Rescue 步骤（if: always()）把工作区已产生但未提交的改动推送出去：
#      干净可编译 → main；损坏状态 → rescue/paper-check 快照分支，绝不丢代码；
#   2) 首步 Queue next run（if: always()）+ 收尾 next-run job 双保险，
#      后继 run 立刻排队，本 run 一结束就接续，循环永不断链；
#   3) DeepSeek 官方 API 兜底：配置 DEEPSEEK_API_KEY secret 后，
#      免费池不可用时走 NVIDIA NIM 模型链（deepseek-v4.1-flash → glm → minimax → step）。

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

# 同一时间只保留 1 个 running + 1 个 pending；当前 run 结束后，后继 run 立刻开始。
concurrency:
  group: continuous-loop-paper
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  NO_COLOR: '1'
  FORCE_COLOR: '0'
  TERM: dumb
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

permissions:
  contents: write
  actions: write

jobs:
  paper-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # 先把下一个 run 排进队列，保证链条不会因为本 run 失败/超时而断掉。
      - name: Queue next run
        if: always() && vars.PAPER_CHECK_FREEZE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME:-main}"
          WF_FILE="${WF_REF%%@*}"
          WF_FILE="${WF_FILE##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac

          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }

          Q="$(pending_other)"
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} queued_successors=${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              echo "[loop] 已派发后继 run（attempt ${attempt}）"
              exit 0
            fi
            echo "[loop][warn] 派发失败（attempt ${attempt}），10s 后重试"
            sleep 10
          done
          echo "[loop][warn] 未能派发后继 run；*/30 定时心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check freeze switch
        id: freeze
        run: |
          set +e
          FROZEN="false"
          if [ "${{ vars.PAPER_CHECK_FREEZE }}" = "true" ] || [ "${{ vars.PAPER_CHECK_FREEZE }}" = "1" ]; then
            FROZEN="true"
          fi
          if [ -f .github/PAPER_CHECK_FREEZE ] || [ -f PAPER_CHECK_FREEZE ]; then
            FROZEN="true"
          fi
          echo "frozen=${FROZEN}" >> "$GITHUB_OUTPUT"
          echo "[freeze] frozen=${FROZEN}"

      - name: Install XeLaTeX and Chinese fonts
        if: steps.freeze.outputs.frozen != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-fonts-recommended latexmk
          xelatex --version | head -1

      - name: Setup Node.js
        if: steps.freeze.outputs.frozen != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install opencode
        if: steps.freeze.outputs.frozen != 'true'
        run: |
          set -euo pipefail
          # 回到 v1（opencode-ai）：走 Zen 免费网关的 opencode/*-free 模型族，
          # 与其他 12 个仓库一致，当前在 runner 上持续可用；
          # v2（@opencode/cli）的 OpenCode Go 匿名免费额度已耗尽，
          # 每次冒烟都返回 "Free usage limit reached"，造成了 33 小时的硬失败循环。
          npm i -g opencode-ai
          opencode --version

      - name: Select a free OpenCode model
        id: model
        if: steps.freeze.outputs.frozen != 'true'
        env:
          # NVIDIA NIM API：主力模型来源（opencode 内置 provider，读该环境变量鉴权）
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail

          # 主力：NVIDIA NIM 模型链（deepseek-v4.1-flash → glm-5.3-flash → glm-5.3
          # → minimax-m3.1-flash → step-5-preview，鉴权 NVIDIA_API_KEY）；
          # 之后回退 Zen 免费池（deepseek-v4.1-flash-free → glm → big-pickle → 其他）。
          PREFERRED="opencode/deepseek-v4.1-flash-free"
          KNOWN=(
            "$PREFERRED"
            "opencode/glm-5.3-flash-free"
            "opencode/big-pickle"
            "opencode/beam-free"
            "opencode/mimo-v2.6-flash-free"
            "opencode/nemotron-3.5-lightning-free"
          )

          # ⭐ v1 配置：写入全局配置目录，并带上权限放行块——v1 没有 v2 的 --auto，
          # 缺权限配置时 agent 会在第一次工具调用处等确认而挂死。
          # NVIDIA NIM 为 opencode 内置 provider（读 NVIDIA_API_KEY），无需合并配置。
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'OCJSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "allow",
              "edit": {
                "*": "allow",
                ".github/**": "deny",
                "**/.github/**": "deny",
                "LICENSE": "deny",
                "**/LICENSE": "deny",
                "**/LICENSE.*": "deny"
              },
              "bash": {
                "*": "allow",
                "rm -rf .github*": "deny",
                "rm -r .github*": "deny",
                "rm .github*": "deny",
                "mv .github*": "deny",
                "git rm -r .github*": "deny",
                "rm *LICENSE*": "deny",
                "mv *LICENSE*": "deny",
                "cp *LICENSE*": "deny",
                "git rm *LICENSE*": "deny",
                "git push*": "deny"
              }
            },
            "model": "opencode/deepseek-v4.1-flash-free"
          }
          OCJSON

          # v1 不依赖 `opencode models` 的输出格式（v1/v2 列表格式不同，且网关挂起时
          # 该命令本身可能超时）。KNOWN 全部直接进入候选，可用性由冒烟决定；
          # models 列表仅用于补充发现额外的 *-free 模型，失败不影响主链路。
          opencode models > /tmp/opencode-models.txt 2>/dev/null || true
          mapfile -t AVAILABLE < <(grep -oE '(opencode|deepseek)/[A-Za-z0-9._-]+' /tmp/opencode-models.txt 2>/dev/null | sort -u || true)

          CANDIDATES=()
          add_candidate() {
            local m="$1" existing
            for existing in "${CANDIDATES[@]:-}"; do
              [ "$existing" = "$m" ] && return 0
            done
            CANDIDATES+=("$m")
          }

          # 主力：NVIDIA NIM 模型链（指定顺序），优先于免费池
          for m in "nvidia/deepseek-ai/deepseek-v4.1-flash" "nvidia/z-ai/glm-5.3-flash" "nvidia/z-ai/glm-5.3" "nvidia/minimaxai/minimax-m3.1-flash" "nvidia/stepfun-ai/step-5-preview"; do
            add_candidate "$m"
          done

          # 已知免费模型优先（顺序即优先级），全部直接冒烟
          for m in "${KNOWN[@]}"; do add_candidate "$m"; done

          # models 列表中发现的额外免费模型
          for a in "${AVAILABLE[@]:-}"; do
            case "$a" in
            opencode/*-free) add_candidate "$a" ;;
            esac
          done


          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "[model][error] 没有找到任何免费候选模型" >&2
            exit 1
          fi

          MODEL=""
          for m in "${CANDIDATES[@]}"; do
            echo "[model] 冒烟测试 ${m} ..."
            SMK_T=90; case "$m" in nvidia/*) SMK_T=300 ;; esac
            if timeout --kill-after=20 $SMK_T opencode run -m "$m" \
                 '只回复两个字：OK' >/tmp/opencode-smoke.log 2>&1; then
              MODEL="$m"
              echo "[model] 可用：${m}"
              break
            fi
            echo "[model] 不可用：${m}"
            tail -n 8 /tmp/opencode-smoke.log 2>/dev/null || true
          done

          if [ -z "$MODEL" ]; then
            echo "[model][error] 所有免费候选模型均不可用" >&2
            exit 1
          fi
          echo "model=${MODEL}" >> "$GITHUB_OUTPUT"

      - name: Run opencode paper checks
        if: steps.freeze.outputs.frozen != 'true'
        env:
          MODEL: ${{ steps.model.outputs.model }}
          # NVIDIA NIM 鉴权（opencode 内置 provider）
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -uo pipefail
          set +e

          # ⭐ 远端同步：后继 run 在本 run 开始时派发，checkout 可能停在旧 commit；对齐远端最新。
          # ⭐ 远端同步：后继 run 在本 run 开始时派发的，workflow_dispatch 在事件创建时解析
          # ref → SHA，排队中的 run 其 checkout 可能停在旧 commit；这里强制对齐远端最新提交。
          BRANCH_SYNC="${GITHUB_REF_NAME:-main}"
          git fetch origin "$BRANCH_SYNC" --prune >/dev/null 2>&1 || true
          if git rev-parse --verify -q "origin/${BRANCH_SYNC}" >/dev/null 2>&1; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${BRANCH_SYNC}")" ]; then
              echo "[sync] 工作区落后于 origin/${BRANCH_SYNC}，重置到最新提交"
              git reset --hard "origin/${BRANCH_SYNC}" >/dev/null 2>&1 || true
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config i18n.commitEncoding utf-8
          git config core.quotepath false

          cat > /tmp/paper-prompt.txt <<'PROMPT'
          你正在 GitHub Actions 中维护仓库里的中文学术论文 paper/paper.tex。
          目标：独立检查并修复论文中的错误，确保它能用 XeLaTeX 干净编译。

          请按以下步骤工作：
          1. 阅读 paper/paper.tex、paper/README.md、out/results.json、out/features.json、out/pairs.csv。
          2. 检查 LaTeX 语法、环境配对、表格列数、\label/\ref、\cite/\bibitem、重复标签和未定义引用。
          3. 对照 out/ 的数据复核论文中的关键数字：胜率、任务聚类置信区间、五维分差、
             长度比、token 比、回归系数、评委分数、v1 跨代结果等。
          4. 在 paper/ 目录运行 `xelatex -interaction=nonstopmode paper.tex` 两遍，检查 paper.log：
             - 不能有 `!` 错误、`Undefined control sequence`、未定义引用或未定义文献；
             - 尽量消除 overfull box；
             - 附录代码段的少量 underfull hbox 可以接受。
          5. 只修复明确的错误，保持论文结构、论证和文风；不要重写全文；不要修改 .github/、
             out/ 数据或无关文件。如果论文已经能干净编译、引用/表格/数字都一致，
             不要为了润色、改写或“再检查一遍”而修改任何文件；没有明确错误时保持 paper.tex 不变。
          6. 如果修改了 paper.tex，必须重新生成 paper/paper.pdf；如果页数变化，同步更新
             paper/README.md 和根 README.md 中的页数。
          7. 不要执行 git commit / git push；工作流会处理提交和同步。
          8. 结束时用简短中文列出：发现的问题、做的修改、编译结果、PDF 页数。

          重要：不要删除或弱化任何原有的数值结论；不确定的修改宁可不做，并在报告中说明。
          PROMPT

          PROMPT_TEXT="$(cat /tmp/paper-prompt.txt)"

          # ⭐ 单次调用约束：本 job 只进行一次论文检查 opencode 调用。
          # 需要下一次调用时由已排队的后继 job 接续（队列 + next-run + */30 心跳兜底）。
          # 前置编译门与模型冒烟测试属测试，不受单次调用限制。
          for i in "run${GITHUB_RUN_NUMBER:-1}"; do
            echo "=========== paper check ${i} ==========="
            # ⭐ 前置测试门（本仓库的“测试”= 论文必须能干净编译，标准同 Final compile verification）。
            # 失败 → 推送当前状态并以 exit 86 提前结束本 job；后继 run 已由 “Queue next run” 派发，数秒内自动接续。
            PRE_OK=1
            if [ -f paper/paper.tex ]; then
              ( cd paper \
                && xelatex -interaction=nonstopmode paper.tex >/tmp/pretest-1.log 2>&1 \
                && xelatex -interaction=nonstopmode paper.tex >/tmp/pretest-2.log 2>&1 ) || true
              if ! { grep -q 'Output written' paper/paper.log 2>/dev/null \
                     && ! grep -qE '^!|Undefined control sequence|LaTeX Error|Citation .* undefined|Reference .* undefined' paper/paper.log; } then
                PRE_OK=0
              fi
              rm -f paper/paper.aux paper/paper.log paper/paper.out
            else
              echo "[pre-test] paper/paper.tex 不存在，视为无可测试内容，放行"
            fi
            if [ "$PRE_OK" -ne 1 ]; then
              echo "[pre-test] 论文编译未通过 → 推送当前状态并提前结束本 job"
              git add -A
              git commit -m "auto: pre-opencode test gate failed (paper compile)" \
                || echo "[pre-test] 没有新内容可提交"
              git pull --rebase origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
              git push origin HEAD:main \
                || echo "[pre-test] [warn] push 失败"
              exit 86
            fi
            echo "[pre-test] 论文编译通过"

            # ⭐ 停滞看门狗阈值：opencode 输出连续无增长的容忍秒数（20 分钟）。
            STALL_TIMEOUT=1200
            # ⭐ 停滞看门狗：后台执行+前台轮询输出大小；停滞 → 终止本次调用（EC=75），
            #    已完成的改动走既有 编译检查→提交→推送 流程；rescue 步骤兜底推送；
            #    下一次迭代立即重新发起调用。
            echo "[watchdog] 停滞看门狗已启用（输出 ${STALL_TIMEOUT}s 无增长即终止本次调用）"
            rm -f /tmp/.oc_exit_code
            LOG_I="/tmp/paper-check-${i}.log"
            setsid bash -c '
              timeout --kill-after=120 "$1" opencode run -m "$2" "$3" < /dev/null 2>&1 | tee "$4"
              echo "${PIPESTATUS[0]}" > /tmp/.oc_exit_code
            ' _ 1500 "$MODEL" "$PROMPT_TEXT" "$LOG_I" &
            OC_BG=$!
            _sz=-1; _ts=$(date +%s); _stalled=0
            while kill -0 "$OC_BG" 2>/dev/null; do
              sleep 20
              _nsz=$(stat -c %s "$LOG_I" 2>/dev/null || echo 0)
              if [ "$_nsz" != "$_sz" ]; then
                _sz="$_nsz"; _ts=$(date +%s)
              elif [ $(( $(date +%s) - _ts )) -ge "$STALL_TIMEOUT" ]; then
                _stalled=1; break
              fi
            done
            if [ "$_stalled" -eq 1 ]; then
              echo "[watchdog] opencode 输出已 ${STALL_TIMEOUT}s 无增长（$LOG_I 停在 ${_sz}B）→ 判定网关停滞，终止本次迭代调用；改动按既有流程提交或由 rescue 推送"
                # 先 TERM 优雅退出，60s 后升级 KILL。注意 GNU timeout 默认把子进程
                # 放进独立进程组（其子进程都在该组），包装进程的组信号够不到它；
                # 因此对每个 cmdline 匹配的进程，向其所在进程组逐一发信号，
                # 包装组 + timeout 子组全覆盖，不留仍持有输出管道的孤儿进程。
                for _pid in $(pgrep -f "opencode run" 2>/dev/null); do
                  _pgid="$(ps -o pgid= -p "$_pid" 2>/dev/null | tr -d '[:space:]')"
                  [ -n "$_pgid" ] && kill -TERM -- "-$_pgid" 2>/dev/null
                done
                kill -TERM -- "-$OC_BG" 2>/dev/null
                pkill -TERM -f "opencode run" 2>/dev/null
                kill -TERM "$OC_BG" 2>/dev/null
                for _w in 1 2 3; do
                  sleep 20
                  kill -0 "$OC_BG" 2>/dev/null || break
                done
                for _pid in $(pgrep -f "opencode run" 2>/dev/null); do
                  _pgid="$(ps -o pgid= -p "$_pid" 2>/dev/null | tr -d '[:space:]')"
                  [ -n "$_pgid" ] && kill -KILL -- "-$_pgid" 2>/dev/null
                done
                kill -KILL -- "-$OC_BG" 2>/dev/null
                pkill -KILL -f "opencode run" 2>/dev/null
                kill -KILL "$OC_BG" 2>/dev/null
                wait "$OC_BG" 2>/dev/null
              EC=75
            else
              wait "$OC_BG" 2>/dev/null
              EC=124
              [ -s /tmp/.oc_exit_code ] && EC=$(cat /tmp/.oc_exit_code)
            fi
            echo "[opencode] iteration=${i} exit=${EC}"

            # 不允许 agent 改动 CI 配置。
            git checkout HEAD -- .github 2>/dev/null || true
            git clean -fdq .github 2>/dev/null || true
            rm -rf opencode.json opencode.jsonc .opencode.json .opencode 2>/dev/null || true
            rm -f paper/paper.aux paper/paper.log paper/paper.out

            # 只有编译通过才提交，避免把损坏的 PDF 推到 GitHub/Gitee。
            COMPILE_OK=0
            if [ -f paper/paper.tex ]; then
              (
                cd paper
                xelatex -interaction=nonstopmode paper.tex >/tmp/paper-compile-${i}-1.log 2>&1 || true
                xelatex -interaction=nonstopmode paper.tex >/tmp/paper-compile-${i}-2.log 2>&1 || true
              )
              if grep -q 'Output written' paper/paper.log 2>/dev/null \
                 && ! grep -qE '^!|Undefined control sequence|LaTeX Error|Citation .* undefined|Reference .* undefined' paper/paper.log; then
                COMPILE_OK=1
              fi
            fi

            if [ "$COMPILE_OK" -ne 1 ]; then
              echo "[warn] iteration ${i} 编译未通过，保留工作区改动但不提交；下一次迭代/下一轮继续修复"
              git reset >/dev/null 2>&1 || true
              continue
            fi

            git add -A
            if git diff --cached --quiet; then
              echo "[git] iteration ${i} 没有产生修改"
              continue
            fi
            # XeLaTeX 每次重新编译都会改变 PDF 的内部时间戳/ID，但源码没变时
            # 不应为这种二进制差异反复提交。
            NON_PDF="$(git diff --cached --name-only | grep -v '^paper/paper.pdf$' | wc -l || true)"
            NON_PDF="${NON_PDF:-0}"
            if [ "$NON_PDF" -eq 0 ]; then
              echo "[git] iteration ${i} 只有 PDF 时间戳变化，跳过提交"
              git reset >/dev/null 2>&1 || true
              git checkout HEAD -- paper/paper.pdf 2>/dev/null || true
              continue
            fi
            git commit -m "paper: automated verification iteration ${i}"
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
            fi
            git push origin HEAD:main || echo "[warn] push 失败；下一轮会重试"
          done

      - name: Final compile verification
        if: steps.freeze.outputs.frozen != 'true'
        run: |
          set -euo pipefail
          cd paper
          xelatex -interaction=nonstopmode paper.tex >/tmp/paper-final-1.log 2>&1
          xelatex -interaction=nonstopmode paper.tex >/tmp/paper-final-2.log 2>&1
          if grep -qE '^!|Undefined control sequence|LaTeX Error|Citation .* undefined|Reference .* undefined' paper.log; then
            echo "[error] 论文没有干净编译："
            tail -n 80 paper.log
            exit 1
          fi
          grep 'Output written' paper.log

      - name: Commit final PDF
        if: steps.freeze.outputs.frozen != 'true'
        run: |
          set +e
          git add paper/paper.pdf paper/paper.tex paper/README.md README.md
          if git diff --cached --quiet; then
            echo "[git] 最终 PDF 无变化"
            exit 0
          fi
          NON_PDF="$(git diff --cached --name-only | grep -v '^paper/paper.pdf$' | wc -l || true)"
          NON_PDF="${NON_PDF:-0}"
          if [ "$NON_PDF" -eq 0 ]; then
            echo "[git] 只有 PDF 时间戳变化，跳过提交"
            git reset >/dev/null 2>&1 || true
            git checkout HEAD -- paper/paper.pdf 2>/dev/null || true
            exit 0
          fi
          git commit -m "paper: regenerate PDF after automated check"
          git pull --rebase origin main || git rebase --abort || true
          git push origin HEAD:main || echo "[warn] final push 失败"

      # ⭐ 失败救援：opencode 无法调用（免费池耗尽 / 官方 API 未配置）、编译门失败、
      # 任意步骤失败或被取消时，把工作区已产生但未提交的改动推送出去，绝不丢弃代码。
      # 干净可编译的状态直接进 main（等同正常收尾）；损坏状态进 rescue/paper-check
      # 快照分支，不污染主干（主干论文必须始终能干净编译，避免触发前置编译门死锁）。
      - name: Rescue - push pending work
        if: always() && steps.freeze.outputs.frozen != 'true'
        continue-on-error: true
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config i18n.commitEncoding utf-8
          git config core.quotepath false
          # 与主路径相同的防篡改清理：不提交 agent 动过的 CI / opencode 配置
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq .github 2>/dev/null || true
          rm -f opencode.json opencode.jsonc .opencode.json 2>/dev/null
          rm -f paper/paper.aux paper/paper.log paper/paper.out
          git add -A
          if git diff --cached --quiet; then
            echo "[rescue] 工作区干净，没有需要救援的内容"
            exit 0
          fi
          git commit -m "auto: rescue checkpoint (run ${GITHUB_RUN_NUMBER})"
          # 判断当前状态是否干净可编译（与 Final compile verification 同一标准）
          COMPILE_OK=0
          if [ -f paper/paper.tex ] && command -v xelatex >/dev/null 2>&1; then
            ( cd paper \
              && xelatex -interaction=nonstopmode paper.tex >/tmp/rescue-c1.log 2>&1 \
              && xelatex -interaction=nonstopmode paper.tex >/tmp/rescue-c2.log 2>&1 ) || true
            if grep -q 'Output written' paper/paper.log 2>/dev/null \
               && ! grep -qE '^!|Undefined control sequence|LaTeX Error|Citation .* undefined|Reference .* undefined' paper/paper.log; then
              COMPILE_OK=1
            fi
            rm -f paper/paper.aux paper/paper.log paper/paper.out
            git add -A
            git commit -m "auto: rescue compile check" 2>/dev/null || true
          fi
          BRANCH="${GITHUB_REF_NAME:-main}"
          if [ "$COMPILE_OK" = "1" ]; then
            git pull --rebase origin "$BRANCH" 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push origin "HEAD:${BRANCH}"; then
              echo "[rescue] 干净可编译状态已直接推送到 ${BRANCH}"
              exit 0
            fi
            echo "[rescue][warn] 推送 ${BRANCH} 失败，转快照分支"
          fi
          git push --force origin "HEAD:refs/heads/rescue/paper-check" \
            && echo "[rescue] 已推送到 rescue/paper-check 快照分支" \
            || echo "[rescue][warn] 快照分支推送也失败；改动记录在本次 run 日志中"

      - name: Upload paper-check logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: paper-check-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            /tmp/paper-check-*.log
            /tmp/paper-compile-*.log
            /tmp/paper-final-*.log
            /tmp/opencode-smoke.log
            /tmp/opencode-models.txt

  # ===== 立刻续跑（下）：独立收尾 job =====
  # needs + if: always()：主 job 无论成功、失败、被取消，这个 job 都会执行。
  # 首步 Queue next run 已在 run 开始时派发过后继；这里做最终兜底——
  # 若后继尚未排队（首步派发失败等），立刻补派，保证循环永不断链
  # （最坏情况也只等下一次 */30 心跳）。
  next-run:
    needs: [paper-check]
    if: always() && vars.PAPER_CHECK_FREEZE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Ensure next run is queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME:-main}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] 收尾检查 repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors=${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需补派"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              echo "[loop] 已补派后继 run（attempt ${attempt}）"
              exit 0
            fi
            echo "[loop][warn] 补派失败（attempt ${attempt}），10s 后重试"
            sleep 10
          done
          echo "[loop][warn] 未能补派后继 run；*/30 定时心跳会补位"
          exit 0
